kind = "web"
previewPath = "/"
title = "مقارنة سجلات الإنتاج"
description = "منصة عامة للشركات لمقارنة سجلات الإنتاج من ملفات CSV وتتبع القيم إلى مصادرها وحفظ الملفات والملاحظات في حساب المستخدم."
version = "1.0.0"
id = "artifacts/ethmar-production"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19912

[services.development]
run = "pnpm --filter @workspace/ethmar-production run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ethmar-production", "run", "build" ]
serve = "static"
publicDir = "artifacts/ethmar-production/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19912"
BASE_PATH = "/"
